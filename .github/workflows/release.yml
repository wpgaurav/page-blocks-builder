name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and attach ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build plugin ZIP
        run: |
          PLUGIN_SLUG="page-blocks-builder"
          BUILD_DIR="${PLUGIN_SLUG}"
          mkdir -p "$BUILD_DIR"

          # Ship everything except what .distignore excludes. The previous
          # allowlist meant a new file had to be remembered in two places, and
          # the verify step below only checked the version header - so a
          # forgotten entry shipped a ZIP missing the feature, silently.
          rsync -a --exclude-from=.distignore \
            --exclude="/${BUILD_DIR}/" --exclude="*.zip" \
            ./ "$BUILD_DIR/"

          zip -r "${PLUGIN_SLUG}-${{ steps.version.outputs.tag }}.zip" "$BUILD_DIR/"

      - name: Verify the packaged artifact
        run: |
          PLUGIN_SLUG="page-blocks-builder"
          ZIP="${PLUGIN_SLUG}-${{ steps.version.outputs.tag }}.zip"
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${TAG#v}"

          unzip -tq "$ZIP"

          # Exactly one plugin root.
          roots=$(unzip -Z1 "$ZIP" | awk -F/ '{print $1}' | sort -u | wc -l)
          [ "$roots" -eq 1 ] || { echo "expected one root dir, found $roots"; exit 1; }

          # The header version must match the tag, so a forgotten bump fails
          # the release instead of shipping a mislabelled ZIP.
          header=$(unzip -p "$ZIP" "$PLUGIN_SLUG/$PLUGIN_SLUG.php" | grep -m1 -E '^ \* Version:' | sed -E 's/.*Version:[[:space:]]*//')
          [ "$header" = "$VERSION" ] || { echo "header version '$header' != tag version '$VERSION'"; exit 1; }
          echo "header version $header matches tag"

          # readme.txt must be present and agree on the stable tag.
          #
          # A prerelease tag (v3.0.0-rc.1) is exempt: readme.txt's Stable tag is
          # what update servers treat as the current stable release, so it must
          # keep naming the last stable version during a beta. Without this
          # exemption an RC could not be tagged at all.
          unzip -l "$ZIP" | grep -q "$PLUGIN_SLUG/readme.txt" || { echo "readme.txt missing from package"; exit 1; }
          stable=$(unzip -p "$ZIP" "$PLUGIN_SLUG/readme.txt" | grep -m1 -E '^Stable tag:' | sed -E 's/.*Stable tag:[[:space:]]*//')
          case "$VERSION" in
            *-*)
              echo "prerelease $VERSION: Stable tag stays at '$stable'"
              ;;
            *)
              [ "$stable" = "$VERSION" ] || { echo "readme Stable tag '$stable' != '$VERSION'"; exit 1; }
              ;;
          esac

          # Files that must never be missing again. The allowlist used to drop
          # these without failing anything.
          for required in "$PLUGIN_SLUG/$PLUGIN_SLUG.php" "$PLUGIN_SLUG/readme.txt" "$PLUGIN_SLUG/includes" "$PLUGIN_SLUG/assets" "$PLUGIN_SLUG/templates"; do
            unzip -Z1 "$ZIP" | grep -q "^${required}" || { echo "missing from package: $required"; exit 1; }
          done

          # Anything present in the repo root that .distignore does not exclude
          # must appear in the ZIP, so adding a file is enough to ship it.
          for f in uninstall.php block.json; do
            if [ -f "$f" ]; then
              unzip -Z1 "$ZIP" | grep -q "^$PLUGIN_SLUG/$f$" || { echo "$f exists in repo but is missing from package"; exit 1; }
            fi
          done
          if [ -d languages ]; then
            unzip -Z1 "$ZIP" | grep -q "^$PLUGIN_SLUG/languages/" || { echo "languages/ exists but is missing from package"; exit 1; }
          fi

          # Nothing that should never ship.
          if unzip -Z1 "$ZIP" | grep -E '(^|/)(\.git|\.github|vendor|node_modules|tests?)/|composer\.(json|lock)|phpstan|\.DS_Store|__release-'; then
            echo "package contains files that must not ship"; exit 1
          fi

          echo "package verified: $(stat -c%s "$ZIP") bytes, version $VERSION"

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: page-blocks-builder-${{ steps.version.outputs.tag }}.zip
